<title id="title">A controlled sign changes the state while leaving the geometry fixed</title><desc id="desc">Two copies of the depth-two piece I=(0,2),J=(2,0) are displayed at identical coordinates. On the right, exactly 64 of its 256 leaves acquire the extra factor minus one because the outer sector k1 is zero and the inner row digit i2 is two. Gold displays only the extra sign, not the original coefficient signs.</desc>
