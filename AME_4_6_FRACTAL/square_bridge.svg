<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 625" role="img" aria-labelledby="title desc">
<title id="title">The same tiling in rectangle and square coordinates</title><desc id="desc">Six pieces from base row i=0 tile the physical rectangle. Applying one common horizontal rescaling maps them to a tiling of the unit square with identical relative areas. The six square-normalized pieces are displayed separately below.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52666e"/></marker>
<pattern id="extra-minus" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d69627"/><path d="M-1,1L1,-1M0,7L7,0M6,8L8,6" stroke="#714a0d" stroke-width=".8"/></pattern></defs>
<rect width="1080" height="625" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243b43">
<text x="28" y="35" font-size="25" text-anchor="start" fill="#243b43" font-weight="bold">A square target works too</text>
<text x="28" y="66" font-size="17" text-anchor="start" fill="#52666e">Apply the same horizontal rescaling to every piece and to the target.</text>
<text x="259.128311" y="115" font-size="20" text-anchor="middle" fill="#243b43">Rectangle R</text>
<text x="927" y="115" font-size="20" text-anchor="middle" fill="#243b43">Unit square</text>
<rect x="35" y="135" width="448.256623" height="183" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(35 318) scale(18.677359 -45.75)"><path d="M10 0h2v1h-2zM6 1h2v1h-2zM0 2h2v1h-2zM6 2h2v1h-2zM12 2h4v1h-4zM0 3h2v1h-2zM8 3h2v1h-2z" fill="#4477aa"/></g>
<g transform="translate(35 318) scale(18.677359 -45.75)"><path d="M0 0h2v1h-2zM4 0h2v1h-2zM23 1h1v1h-1zM16 2h1v1h-1zM22 2h1v1h-1zM2 3h4v1h-4zM16 3h2v1h-2zM19 3h2v1h-2zM23 3h1v1h-1z" fill="#ee6677"/></g>
<g transform="translate(35 318) scale(18.677359 -45.75)"><path d="M21 0h3v1h-3zM14 1h2v1h-2zM21 1h1v1h-1zM10 2h2v1h-2zM20 2h2v1h-2zM23 2h1v1h-1zM10 3h2v1h-2zM14 3h2v1h-2zM22 3h1v1h-1z" fill="#228833"/></g>
<g transform="translate(35 318) scale(18.677359 -45.75)"><path d="M12 0h4v1h-4zM18 0h2v1h-2zM8 1h4v1h-4zM16 1h4v1h-4zM18 2h2v1h-2z" fill="#ccbb44"/></g>
<g transform="translate(35 318) scale(18.677359 -45.75)"><path d="M2 0h2v1h-2zM16 0h2v1h-2zM20 0h1v1h-1zM0 1h2v1h-2zM4 1h2v1h-2zM20 1h1v1h-1zM22 1h1v1h-1zM4 2h2v1h-2zM17 2h1v1h-1zM18 3h1v1h-1zM21 3h1v1h-1z" fill="#66ccee"/></g>
<g transform="translate(35 318) scale(18.677359 -45.75)"><path d="M6 0h4v1h-4zM2 1h2v1h-2zM12 1h2v1h-2zM2 2h2v1h-2zM8 2h2v1h-2zM6 3h2v1h-2zM12 3h2v1h-2z" fill="#aa3377"/></g>
<rect x="35" y="135" width="448.256623" height="183" fill="none" stroke="#aab9bf" stroke-width="0.8"/>
<rect x="835" y="135" width="183" height="183" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(835 318) scale(7.625 -45.75)"><path d="M10 0h2v1h-2zM6 1h2v1h-2zM0 2h2v1h-2zM6 2h2v1h-2zM12 2h4v1h-4zM0 3h2v1h-2zM8 3h2v1h-2z" fill="#4477aa"/></g>
<g transform="translate(835 318) scale(7.625 -45.75)"><path d="M0 0h2v1h-2zM4 0h2v1h-2zM23 1h1v1h-1zM16 2h1v1h-1zM22 2h1v1h-1zM2 3h4v1h-4zM16 3h2v1h-2zM19 3h2v1h-2zM23 3h1v1h-1z" fill="#ee6677"/></g>
<g transform="translate(835 318) scale(7.625 -45.75)"><path d="M21 0h3v1h-3zM14 1h2v1h-2zM21 1h1v1h-1zM10 2h2v1h-2zM20 2h2v1h-2zM23 2h1v1h-1zM10 3h2v1h-2zM14 3h2v1h-2zM22 3h1v1h-1z" fill="#228833"/></g>
<g transform="translate(835 318) scale(7.625 -45.75)"><path d="M12 0h4v1h-4zM18 0h2v1h-2zM8 1h4v1h-4zM16 1h4v1h-4zM18 2h2v1h-2z" fill="#ccbb44"/></g>
<g transform="translate(835 318) scale(7.625 -45.75)"><path d="M2 0h2v1h-2zM16 0h2v1h-2zM20 0h1v1h-1zM0 1h2v1h-2zM4 1h2v1h-2zM20 1h1v1h-1zM22 1h1v1h-1zM4 2h2v1h-2zM17 2h1v1h-1zM18 3h1v1h-1zM21 3h1v1h-1z" fill="#66ccee"/></g>
<g transform="translate(835 318) scale(7.625 -45.75)"><path d="M6 0h4v1h-4zM2 1h2v1h-2zM12 1h2v1h-2zM2 2h2v1h-2zM8 2h2v1h-2zM6 3h2v1h-2zM12 3h2v1h-2z" fill="#aa3377"/></g>
<rect x="835" y="135" width="183" height="183" fill="none" stroke="#aab9bf" stroke-width="0.8"/>
<text x="653" y="198" font-size="20" text-anchor="middle" fill="#243b43">S(x,y) = (x/√6,y)</text>
<line x1="545" y1="230" x2="771" y2="230" stroke="#52666e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="653" y="267" font-size="17" text-anchor="middle" fill="#52666e">same relative areas</text>
<text x="28" y="366" font-size="20" text-anchor="start" fill="#243b43">The six corresponding pieces in square coordinates</text>
<rect x="47" y="398" width="130" height="130" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(47 528) scale(5.416667 -32.5)"><path d="M10 0h2v1h-2zM6 1h2v1h-2zM0 2h2v1h-2zM6 2h2v1h-2zM12 2h4v1h-4zM0 3h2v1h-2zM8 3h2v1h-2z" fill="#4477aa"/></g>
<text x="112" y="555" font-size="17" text-anchor="middle" fill="#52666e">j = 2</text>
<rect x="219" y="398" width="130" height="130" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(219 528) scale(5.416667 -32.5)"><path d="M0 0h2v1h-2zM4 0h2v1h-2zM23 1h1v1h-1zM16 2h1v1h-1zM22 2h1v1h-1zM2 3h4v1h-4zM16 3h2v1h-2zM19 3h2v1h-2zM23 3h1v1h-1z" fill="#ee6677"/></g>
<text x="284" y="555" font-size="17" text-anchor="middle" fill="#52666e">j = 4</text>
<rect x="391" y="398" width="130" height="130" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(391 528) scale(5.416667 -32.5)"><path d="M21 0h3v1h-3zM14 1h2v1h-2zM21 1h1v1h-1zM10 2h2v1h-2zM20 2h2v1h-2zM23 2h1v1h-1zM10 3h2v1h-2zM14 3h2v1h-2zM22 3h1v1h-1z" fill="#228833"/></g>
<text x="456" y="555" font-size="17" text-anchor="middle" fill="#52666e">j = 0</text>
<rect x="563" y="398" width="130" height="130" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(563 528) scale(5.416667 -32.5)"><path d="M12 0h4v1h-4zM18 0h2v1h-2zM8 1h4v1h-4zM16 1h4v1h-4zM18 2h2v1h-2z" fill="#ccbb44"/></g>
<text x="628" y="555" font-size="17" text-anchor="middle" fill="#52666e">j = 1</text>
<rect x="735" y="398" width="130" height="130" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(735 528) scale(5.416667 -32.5)"><path d="M2 0h2v1h-2zM16 0h2v1h-2zM20 0h1v1h-1zM0 1h2v1h-2zM4 1h2v1h-2zM20 1h1v1h-1zM22 1h1v1h-1zM4 2h2v1h-2zM17 2h1v1h-1zM18 3h1v1h-1zM21 3h1v1h-1z" fill="#66ccee"/></g>
<text x="800" y="555" font-size="17" text-anchor="middle" fill="#52666e">j = 5</text>
<rect x="907" y="398" width="130" height="130" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(907 528) scale(5.416667 -32.5)"><path d="M6 0h4v1h-4zM2 1h2v1h-2zM12 1h2v1h-2zM2 2h2v1h-2zM8 2h2v1h-2zM6 3h2v1h-2zM12 3h2v1h-2z" fill="#aa3377"/></g>
<text x="972" y="555" font-size="17" text-anchor="middle" fill="#52666e">j = 3</text>
<text x="28" y="599" font-size="17" text-anchor="start" fill="#52666e">In square coordinates one step is self-affine. Two steps together form a similarity with ratio 1/96.</text>
</g></svg>
