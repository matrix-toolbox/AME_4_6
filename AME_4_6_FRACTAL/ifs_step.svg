<rect x="654" y="145" width="401.716318" height="164" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(654 309) scale(4.184545 -1.708333)"><path d="M48 4h3v1h-3zM52 4h3v1h-3zM56 4h3v1h-3zM60 4h3v1h-3zM72 4h3v1h-3zM76 4h3v1h-3zM48 5h3v1h-3zM52 5h3v1h-3zM56 5h3v1h-3zM60 5h3v1h-3zM72 5h3v1h-3zM76 5h3v1h-3zM49 6h1v1h-1zM53 6h1v1h-1zM57 6h1v1h-1zM61 6h1v1h-1zM73 6h1v1h-1zM77 6h1v1h-1zM49 7h1v1h-1zM53 7h1v1h-1zM57 7h1v1h-1zM61 7h1v1h-1zM73 7h1v1h-1zM77 7h1v1h-1zM48 8h1v1h-1zM52 8h1v1h-1zM56 8h1v1h-1zM60 8h1v1h-1zM72 8h1v1h-1zM76 8h1v1h-1zM48 9h1v1h-1zM52 9h1v1h-1zM56 9h1v1h-1zM60 9h1v1h-1zM72 9h1v1h-1zM76 9h1v1h-1zM48 10h1v1h-1zM52 10h1v1h-1zM56 10h1v1h-1zM60 10h1v1h-1zM72 10h1v1h-1zM76 10h1v1h-1zM48 11h1v1h-1zM52 11h1v1h-1zM56 11h1v1h-1zM60 11h1v1h-1zM72 11h1v1h-1zM76 11h1v1h-1zM49 12h1v1h-1zM53 12h1v1h-1zM57 12h1v1h-1zM61 12h1v1h-1zM73 12h1v1h-1zM77 12h1v1h-1zM49 13h1v1h-1zM53 13h1v1h-1zM57 13h1v1h-1zM61 13h1v1h-1zM73 13h1v1h-1zM77 13h1v1h-1zM49 14h1v1h-1zM53 14h1v1h-1zM57 14h1v1h-1zM61 14h1v1h-1zM73 14h1v1h-1zM77 14h1v1h-1zM49 15h1v1h-1zM53 15h1v1h-1zM57 15h1v1h-1zM61 15h1v1h-1zM73 15h1v1h-1zM77 15h1v1h-1zM32 28h3v1h-3zM36 28h3v1h-3zM40 28h3v1h-3zM44 28h3v1h-3zM64 28h3v1h-3zM68 28h3v1h-3zM72 28h3v1h-3zM76 28h3v1h-3zM32 29h3v1h-3zM36 29h3v1h-3zM40 29h3v1h-3zM44 29h3v1h-3zM64 29h3v1h-3zM68 29h3v1h-3zM72 29h3v1h-3zM76 29h3v1h-3zM33 30h1v1h-1zM37 30h1v1h-1zM41 30h1v1h-1zM45 30h1v1h-1zM65 30h1v1h-1zM69 30h1v1h-1zM73 30h1v1h-1zM77 30h1v1h-1zM33 31h1v1h-1zM37 31h1v1h-1zM41 31h1v1h-1zM45 31h1v1h-1zM65 31h1v1h-1zM69 31h1v1h-1zM73 31h1v1h-1zM77 31h1v1h-1zM32 32h1v1h-1zM36 32h1v1h-1zM40 32h1v1h-1zM44 32h1v1h-1zM64 32h1v1h-1zM68 32h1v1h-1zM72 32h1v1h-1zM76 32h1v1h-1zM32 33h1v1h-1zM36 33h1v1h-1zM40 33h1v1h-1zM44 33h1v1h-1zM64 33h1v1h-1zM68 33h1v1h-1zM72 33h1v1h-1zM76 33h1v1h-1zM32 34h1v1h-1zM36 34h1v1h-1zM40 34h1v1h-1zM44 34h1v1h-1zM64 34h1v1h-1zM68 34h1v1h-1zM72 34h1v1h-1zM76 34h1v1h-1zM32 35h1v1h-1zM36 35h1v1h-1zM40 35h1v1h-1zM44 35h1v1h-1zM64 35h1v1h-1zM68 35h1v1h-1zM72 35h1v1h-1zM76 35h1v1h-1zM33 36h1v1h-1zM37 36h1v1h-1zM41 36h1v1h-1zM45 36h1v1h-1zM65 36h1v1h-1zM69 36h1v1h-1zM73 36h1v1h-1zM77 36h1v1h-1zM33 37h1v1h-1zM37 37h1v1h-1zM41 37h1v1h-1zM45 37h1v1h-1zM65 37h1v1h-1zM69 37h1v1h-1zM73 37h1v1h-1zM77 37h1v1h-1zM33 38h1v1h-1zM37 38h1v1h-1zM41 38h1v1h-1zM45 38h1v1h-1zM65 38h1v1h-1zM69 38h1v1h-1zM73 38h1v1h-1zM77 38h1v1h-1zM33 39h1v1h-1zM37 39h1v1h-1zM41 39h1v1h-1zM45 39h1v1h-1zM65 39h1v1h-1zM69 39h1v1h-1zM73 39h1v1h-1zM77 39h1v1h-1zM72 52h3v1h-3zM76 52h3v1h-3zM72 53h3v1h-3zM76 53h3v1h-3zM73 54h1v1h-1zM77 54h1v1h-1zM73 55h1v1h-1zM77 55h1v1h-1zM72 56h1v1h-1zM76 56h1v1h-1zM72 57h1v1h-1zM76 57h1v1h-1zM72 58h1v1h-1zM76 58h1v1h-1zM72 59h1v1h-1zM76 59h1v1h-1zM73 60h1v1h-1zM77 60h1v1h-1zM73 61h1v1h-1zM77 61h1v1h-1zM73 62h1v1h-1zM77 62h1v1h-1zM73 63h1v1h-1zM77 63h1v1h-1z" fill="#267c82"/></g>
<g transform="translate(654 309) scale(4.184545 -1.708333)"><path d="M32 28h3v1h-3zM32 29h3v1h-3zM33 30h1v1h-1zM33 31h1v1h-1zM32 32h1v1h-1zM32 33h1v1h-1zM32 34h1v1h-1zM32 35h1v1h-1zM33 36h1v1h-1zM33 37h1v1h-1zM33 38h1v1h-1zM33 39h1v1h-1z" fill="#d69627"/></g>
<line x1="489" y1="225" x2="606" y2="225" stroke="#52666e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="548" y="198" font-size="17" text-anchor="middle" fill="#52666e">same rule</text>
<rect x="175.905439" y="227" width="16.73818" height="41" fill="none" stroke="#754f18" stroke-width="2.2"/>
<rect x="787.905439" y="227" width="16.73818" height="41" fill="none" stroke="#754f18" stroke-width="2.2"/>
<text x="28" y="374" font-size="21" text-anchor="start" fill="#243b43" font-weight="bold">Inside the highlighted atom</text>
<text x="28" y="404" font-size="17" text-anchor="start" fill="#52666e">A quarter-turn changes the wide rectangle into the tall atom. No stretching occurs in the physical rectangle.</text>
<rect x="108" y="451" width="105" height="257.196423" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(108 708.196423) scale(26.25 -10.716518)"><path d="M0 4h3v1h-3zM0 5h3v1h-3zM1 6h1v1h-1zM1 7h1v1h-1zM0 8h1v1h-1zM0 9h1v1h-1zM0 10h1v1h-1zM0 11h1v1h-1zM1 12h1v1h-1zM1 13h1v1h-1zM1 14h1v1h-1zM1 15h1v1h-1z" fill="#d69627"/></g>
<line x1="269" y1="582" x2="370" y2="582" stroke="#52666e" stroke-width="2" marker-end="url(#arrow)"/>
<text x="424" y="492" font-size="21" text-anchor="start" fill="#243b43">16 occupied descendants</text>
<text x="424" y="529" font-size="18" text-anchor="start" fill="#52666e">Each copy has the original rectangle’s shape.</text>
<text x="424" y="565" font-size="18" text-anchor="start" fill="#52666e">Each length is multiplied by 1/√96.</text>
<text x="424" y="601" font-size="18" text-anchor="start" fill="#52666e">Each area is multiplied by 1/96.</text>
<text x="424" y="653" font-size="18" text-anchor="start" fill="#243b43">16 retained copies give area fraction 16/96 = 1/6.</text>
<text x="28" y="761" font-size="16" text-anchor="start" fill="#52666e">This geometric rule uses the same atom data as the seed. The coloured zoom is an enlargement, not an additional piece.</text>
</g></svg>
