<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 790" role="img" aria-labelledby="title desc">
<title id="title">How the quarter-turn substitution works</title><desc id="desc">The selected base mask is replaced inside each of its 16 atoms by a clockwise rotated, uniformly shrunken copy of itself. A highlighted atom is enlarged below. All 16 descendants in that block are shown in their exact relative positions. The rectangle aspect ratio is square root of six throughout.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52666e"/></marker>
<pattern id="extra-minus" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d69627"/><path d="M-1,1L1,-1M0,7L7,0M6,8L8,6" stroke="#714a0d" stroke-width=".8"/></pattern></defs>
<rect width="1110" height="790" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243b43">
<text x="28" y="34" font-size="25" text-anchor="start" fill="#243b43" font-weight="bold">One rule at every occupied atom</text>
<text x="28" y="64" font-size="17" text-anchor="start" fill="#52666e">Shrink by 1/√96, rotate clockwise by 90°, and put the copy into the selected atom.</text>
<text x="242.858159" y="123" font-size="20" text-anchor="middle" fill="#243b43">One piece: 16 atoms</text>
<text x="854.858159" y="123" font-size="20" text-anchor="middle" fill="#243b43">Replace every atom: 256 cells</text>
