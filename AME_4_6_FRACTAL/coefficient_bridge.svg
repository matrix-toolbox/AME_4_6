<text x="555.166667" y="96" font-size="18" text-anchor="middle" fill="#52666e">k = 3</text>
<line x1="480" y1="111" x2="480" y2="479.239958" stroke="#aab9bf" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="705.5" y="96" font-size="18" text-anchor="middle" fill="#52666e">k = 4</text>
<line x1="630.333333" y1="111" x2="630.333333" y2="479.239958" stroke="#aab9bf" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="855.833333" y="96" font-size="18" text-anchor="middle" fill="#52666e">k = 5</text>
<line x1="780.666667" y1="111" x2="780.666667" y2="479.239958" stroke="#aab9bf" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="85.375" y="440.209963" font-size="21" text-anchor="middle" fill="#38270b">−4</text>
<text x="160.541667" y="164.029995" font-size="21" text-anchor="middle" fill="#38270b">−4</text>
<text x="122.958333" y="164.029995" font-size="21" text-anchor="middle" fill="#38270b">−4</text>
<text x="47.791667" y="440.209963" font-size="21" text-anchor="middle" fill="#38270b">−4</text>
<text x="28" y="507" font-size="17" text-anchor="start" fill="#52666e">4 atoms → area fraction 4/96 = 1/24 → Tᵍ₀₄₀₄ = −1/2 → normalized amplitude ψ₀₄₀₄ = −1/12</text>
