<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">The coefficient Tᵍ[0,4,0,4] in a rectangular piece</title><desc id="desc">The piece with i=0,j=4 has 16 atoms. Four highlighted gold atoms, at (0,0), (1,0), (2,3), (3,3), carry sector k=0, colour l=4 and a minus sign. Their total area fraction is four over ninety-six, or one over twenty-four, and they encode Tᵍ[0,4,0,4]=minus one half.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52666e"/></marker>
<pattern id="extra-minus" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#d69627"/><path d="M-1,1L1,-1M0,7L7,0M6,8L8,6" stroke="#714a0d" stroke-width=".8"/></pattern></defs>
<rect width="960" height="520" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243b43">
<text x="28" y="34" font-size="24" text-anchor="start" fill="#243b43" font-weight="bold">Piece (i,j) = (0,4)</text>
<text x="28" y="62" font-size="18" text-anchor="start" fill="#52666e">Gold: k = 0, l = 4, sign −. The other occupied atoms are pale.</text>
<rect x="29" y="111" width="902" height="368.239958" fill="#f5f7f8" stroke="#aab9bf" stroke-width="0.8"/>
<g transform="translate(29 479.239958) scale(37.583333 -92.059989)"><path d="M0 0h2v1h-2zM4 0h2v1h-2zM23 1h1v1h-1zM16 2h1v1h-1zM22 2h1v1h-1zM2 3h4v1h-4zM16 3h2v1h-2zM19 3h2v1h-2zM23 3h1v1h-1z" fill="#cedce1"/></g>
<g transform="translate(29 479.239958) scale(37.583333 -92.059989)"><path d="M0 0h2v1h-2zM2 3h2v1h-2z" fill="#d69627"/></g>
<text x="104.166667" y="96" font-size="18" text-anchor="middle" fill="#52666e">k = 0</text>
<text x="254.5" y="96" font-size="18" text-anchor="middle" fill="#52666e">k = 1</text>
<line x1="179.333333" y1="111" x2="179.333333" y2="479.239958" stroke="#aab9bf" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="404.833333" y="96" font-size="18" text-anchor="middle" fill="#52666e">k = 2</text>
