<title id="title">The complete order-6 geomagic array</title><desc id="desc">All 36 base pieces, in the row and column orders for which the two displayed diagonals tile the target. Each pale rectangle shows the same full target R. The occupied cells form one piece. Colours identify column positions only.</desc>
